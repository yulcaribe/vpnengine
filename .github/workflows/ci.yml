name: Test VPN Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Check shell scripts
        run: bash -n install.sh uninstall.sh
      - name: Check web scripts
        run: node --check web/app.js
      - name: Check Go formatting
        shell: bash
        run: |
          FILES="$(gofmt -l .)"
          if [ -n "$FILES" ]; then
            echo "$FILES"
            exit 1
          fi
      - name: Unit tests and vet
        run: |
          go test -race ./...
          go vet ./...
      - name: Exercise installer with actual Go compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          source ./install.sh
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf -- "$WORK_DIR"' EXIT
          ARCH=amd64
          download_source() {
            mkdir -p "$WORK_DIR/source"
            cp -a "$GITHUB_WORKSPACE/." "$WORK_DIR/source/"
            SOURCE_COMMIT="$GITHUB_SHA"
            SOURCE_VERSION="$(sed -n 's/^var version = "\([0-9][0-9.]*\)"$/\1/p' main.go)"
            RELEASE_TAG="$SOURCE_VERSION+${SOURCE_COMMIT:0:12}"
          }
          prepare_go() {
            GO_BIN="$(command -v go)"
          }
          build_from_source
          test -x "$CANDIDATE"
          test "$("$CANDIDATE" --version)" = "VPN Engine $RELEASE_TAG"
      - name: Compile Linux amd64 and arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/vpn-engine-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/vpn-engine-arm64 .
          rm -f /tmp/vpn-engine-amd64 /tmp/vpn-engine-arm64
